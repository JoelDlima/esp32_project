; ── USB upload (first flash / recovery) ─────────────────────────────────────
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 115200
upload_port   = COM3
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9

; ── OTA upload (after first flash – no USB needed) ───────────────────────────
; Usage:
;   pio run -e esp32dev_ota --target upload
;
; Replace 10.183.227.27 with the IP shown on the OLED or serial monitor.
; Password must match OTA_PASSWORD in main.cpp  (default: CHANGE_ME_OTA_PASSWORD)
[env:esp32dev_ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed   = 115200
upload_protocol = espota
upload_port     = 10.183.227.27
upload_flags    =
    --auth=CHANGE_ME_OTA_PASSWORD
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9
